 if(e.boss&&e.hp<e.maxHp*.5&&e.phase===1){e.phase=2;e.cool=.3;banner=e.def.name+' / 제2페이즈';bannerTime=2;shake=.25;spark(e.x,e.y,MAPS[run.map].palette[10],26)}
 if(e.wind>0){e.wind-=dt*slow;if(e.wind<=0){if(e.ai==='sniper'){enemyShot(e,e.angle,1,0,145);e.cool=2.8}else if(e.ai==='bomber'){area(e.x,e.y,29,e.damage*1.2,false);e.on=false;run.stageKilled++;spark(e.x,e.y,MAPS[run.map].palette[9],24)}else{e.dashing=e.dashNext||.45;e.dashNext=0}}}

function updateBullet(b,dt){b.life-=dt;if(b.life<=0){b.on=false;return}if(b.homing){let target=nearest(b.x,b.y);if(target){let a=Math.atan2(target.y-b.y,target.x-b.x),old=Math.atan2(b.vy,b.vx),angle=old+clamp(deltaAngle(a,old),-dt*5,dt*5),speed=Math.hypot(b.vx,b.vy);b.vx=Math.cos(angle)*speed;b.vy=Math.sin(angle)*speed}}let steps=Math.ceil(Math.hypot(b.vx,b.vy)*dt/3)||1;for(let i=0;i<steps&&b.on;i++){let nx=b.x+b.vx*dt/steps,ny=b.y+b.vy*dt/steps;if(collides(nx,ny,b.r)){if(b.bounce>0){if(collides(nx,b.y,b.r))b.vx=-b.vx;if(collides(b.x,ny,b.r))b.vy=-b.vy;b.bounce--}else b.on=false;continue}b.x=nx;b.y=ny;if(b.friendly){enemies.each(e=>{if(b.on&&dist(b,e)<e.r+b.r){hitEnemy(e,b.damage,b.crit);b.on=false;spark(b.x,b.y,MAPS[run.map].palette[7],3)}})}else if(dist(b,run.player)<b.r+run.player.r){hurt(b.damage);b.on=false}}}
function segmentDistance(px,py,x,y,a,len){let dx=px-x,dy=py-y,t=clamp(dx*Math.cos(a)+dy*Math.sin(a),0,len);return Math.hypot(dx-Math.cos(a)*t,dy-Math.sin(a)*t)}
function updateHazard(h,dt){h.life-=dt;h.delay-=dt;if(h.life<=0){h.on=false;return}if(h.kind==='orbit'){h.x=run.player.x;h.y=run.player.y;h.angle+=dt*5;h.tick+=dt;for(let i=0;i<3;i++){let x=h.x+Math.cos(h.angle+i*Math.PI*2/3)*h.r,y=h.y+Math.sin(h.angle+i*Math.PI*2/3)*h.r;enemies.each(e=>{if(dist(e,{x,y})<e.r+7&&(h.hits.get(e)||0)<h.tick){hitEnemy(e,h.damage,h.crit);h.hits.set(e,h.tick+.4)}})}return}if(h.delay>0)return;if(h.kind==='trap'){let near=false;enemies.each(e=>{if(dist(e,h)<h.r)near=true});if(near){area(h.x,h.y,h.r,h.damage,true,h.crit);h.on=false}return}if(h.kind==='bomb'&&!h.fired){h.fired=true;area(h.x,h.y,h.r,h.damage,h.friendly,h.crit)}else if(h.kind==='beam'){if(segmentDistance(run.player.x,run.player.y,h.x,h.y,h.a,h.length)<9)hurt(h.damage)}else if(h.kind==='train'){let p=run.player;if(p.x>h.x&&p.x<h.x+h.w&&p.y>h.y-5&&p.y<h.y+h.h+5)hurt(h.damage)}else if(h.kind==='wave'&&!h.fired){h.fired=true;area(h.x,h.y,h.r,h.damage,false);let a=Math.atan2(run.player.y-h.y,run.player.x-h.x);if(dist(run.player,h)<h.r)move(run.player,Math.cos(a)*18,Math.sin(a)*18)}}

function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function pixelLine(x,y,xx,yy,color,width=1,dashed=false){x=Math.round(x);y=Math.round(y);xx=Math.round(xx);yy=Math.round(yy);let dx=Math.abs(xx-x),sx=x<xx?1:-1,dy=-Math.abs(yy-y),sy=y<yy?1:-1,err=dx+dy,n=0;for(let limit=0;limit<1600;limit++){if(!dashed||n++%6<3)rect(x,y,width,width,color);if(x===xx&&y===yy)break;let e=2*err;if(e>=dy){err+=dy;x+=sx}if(e<=dx){err+=dx;y+=sy}}}
function ring(x,y,r,color){let last=null;for(let i=0;i<=40;i++){let a=i*Math.PI/20,p={x:Math.round(x+Math.cos(a)*r),y:Math.round(y+Math.sin(a)*r)};if(last)pixelLine(last.x,last.y,p.x,p.y,color);last=p}}
